<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>양일고 자동차 동아리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3f4f6; --card:#ffffff; --ink:#111827; --sub:#6b7280; --line:#e5e7eb;
    --brand:#0f172a; --accent:#f97316; --accent-soft:#fff7ed; --chip:#f3f4f6;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0b0f17; --card:#131a26; --ink:#e5e7eb; --sub:#9ca3af; --line:#253045;
      --brand:#0a0e15; --accent:#fb923c; --accent-soft:#2a1a0e; --chip:#1b2433;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  header{background:var(--brand);color:#fff;padding:40px 16px 72px;position:relative;overflow:hidden}
  header::after{content:"";position:absolute;right:-60px;bottom:-60px;width:260px;height:260px;border-radius:50%;border:28px solid rgba(249,115,22,.18)}
  .wrap{max-width:820px;margin:0 auto;position:relative}
  .badge{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:3px 10px;margin-bottom:14px}
  h1{margin:0 0 8px;font-size:32px;font-weight:900;letter-spacing:-.03em}
  header p{margin:0;color:#cbd5e1;font-size:15px}
  main{padding:0 16px 48px;margin-top:-44px}
  section{margin-bottom:28px}
  h2{font-size:15px;margin:0 0 12px;color:var(--sub);font-weight:700;letter-spacing:.02em}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
  .card{display:block;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;transition:border-color .15s, transform .15s}
  a.card:hover{border-color:var(--accent);transform:translateY(-2px)}
  a.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .ic{width:40px;height:40px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:12px}
  .ic svg{width:22px;height:22px}
  .card h3{margin:0 0 4px;font-size:17px}
  .card p{margin:0;font-size:13.5px;color:var(--sub)}
  .who{display:inline-block;margin-top:10px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--chip);color:var(--sub)}
  .empty{background:transparent;border-style:dashed;color:var(--sub);font-size:13.5px;text-align:center;padding:26px 20px}
  footer{text-align:center;color:var(--sub);font-size:12px;padding:8px 16px 32px}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <span class="badge">YANGIL AUTO CLUB</span>
    <h1>양일고 자동차 동아리</h1>
    <p>차량 케어 서비스, 브랜드 탐구 자료, 수업자료를 한곳에 모았습니다.</p>
  </div>
</header>

<main>
<div class="wrap">

  <section>
    <h2>차량 케어</h2>
    <div class="grid">
      <a class="card" href="car-care/">
        <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14M6 17v2M18 17v2M4 13l2-6h12l2 6v4H4z"/><circle cx="8" cy="14" r="1"/><circle cx="16" cy="14" r="1"/></svg></div>
        <h3>차량 케어 신청</h3>
        <p>차량 정보를 남기면 동아리 학생들이 맞는 부품과 적정 가격을 조사해 드립니다.</p>
        <span class="who">선생님용</span>
      </a>
      <a class="card" href="car-care/recommend.html">
        <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg></div>
        <h3>부품 추천서 작성</h3>
        <p>접수된 차량의 규격·품번·가격·근거를 조사해 추천서를 작성합니다.</p>
        <span class="who">동아리 학생용</span>
      </a>
    </div>
  </section>

  <section>
    <h2>브랜드 탐구</h2>
    <div class="grid">
      <div class="card empty">자동차 브랜드 역사 PPT가 여기에 추가됩니다.</div>
    </div>
  </section>

  <section>
    <h2>수업자료</h2>
    <div class="grid">
      <div class="card empty">동아리 수업자료가 여기에 추가됩니다.</div>
    </div>
  </section>

</div>
</main>

<footer>양일고등학교 자동차 동아리</footer>
</body>
</html>
