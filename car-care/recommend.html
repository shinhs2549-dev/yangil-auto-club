<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>부품 추천서 작성</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3f4f6; --card:#ffffff; --ink:#111827; --sub:#6b7280; --line:#e5e7eb;
    --brand:#0f172a; --accent:#f97316; --accent-soft:#fff7ed; --ok:#16a34a; --err:#dc2626; --amber:#d97706;
    --field:#f9fafb; --chip:#f3f4f6;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0b0f17; --card:#131a26; --ink:#e5e7eb; --sub:#9ca3af; --line:#253045;
      --brand:#0a0e15; --accent:#fb923c; --accent-soft:#2a1a0e; --field:#0f1520; --chip:#1b2433;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
  header{background:var(--brand);color:#fff;padding:28px 16px 64px}
  .wrap{max-width:720px;margin:0 auto}
  .badge{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:3px 10px;margin-bottom:12px}
  .badge.rv{background:var(--accent);color:#111}
  .back{display:inline-block;color:#cbd5e1;font-size:13px;text-decoration:none;margin-bottom:14px}
  .back:hover{color:#fff}
  h1{margin:0 0 6px;font-size:26px;font-weight:900;letter-spacing:-.02em}
  header p{margin:0;color:#cbd5e1;font-size:14px}
  main{padding:0 16px 48px;margin-top:-40px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 20px;margin-bottom:14px}
  h2{font-size:16px;margin:0 0 16px;display:flex;align-items:center;gap:8px}
  h2 .n{width:24px;height:24px;border-radius:7px;background:var(--brand);color:#fff;font-size:12px;display:grid;place-items:center}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) h2 .n{background:var(--accent);color:#111} }
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  @media (max-width:560px){ .row,.row3{grid-template-columns:1fr} }
  .f{margin-bottom:14px}
  label.t{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
  .req{color:var(--accent);margin-left:2px}
  .opt{color:var(--sub);font-weight:400;font-size:12px;margin-left:4px}
  input[type=text],select,textarea{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none;transition:border-color .15s}
  input:focus,select:focus,textarea:focus{border-color:var(--accent)}
  textarea{min-height:80px;resize:vertical}
  .hint{font-size:12px;color:var(--sub);margin-top:5px}
  .load{display:flex;gap:8px}
  .load input{flex:1;text-transform:uppercase;letter-spacing:.05em}
  .load select{flex:1;min-width:0}
  .hidedone{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--sub);margin-top:8px;cursor:pointer}
  .hidedone input{accent-color:var(--accent)}
  .manual{margin-top:8px;font-size:13px;color:var(--sub)}
  .manual summary{cursor:pointer}
  .btn{font:inherit;font-size:15px;font-weight:700;border:0;border-radius:10px;padding:11px 16px;background:var(--brand);color:#fff;cursor:pointer;white-space:nowrap}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn{background:#253045} }
  .btn.accent{background:var(--accent);color:#fff}
  .btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
  .btn:disabled{opacity:.6;cursor:wait}
  .msg{font-size:13px;margin-top:8px;display:none}
  .msg.ok{color:var(--ok)} .msg.err{color:var(--err)}
  .req-box{display:none;background:var(--accent-soft);border-radius:12px;padding:14px 16px;font-size:13.5px;margin-top:4px}
  .req-box b{color:var(--accent)}
  .req-box div{margin-top:3px}
  .item{border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;background:var(--card)}
  .item-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .item-head .no{font-weight:900;color:var(--accent);font-size:14px;flex:none}
  .item-head input{font-weight:700}
  .del{background:none;border:0;color:var(--sub);font-size:13px;cursor:pointer;flex:none;padding:6px}
  .del:hover{color:var(--err)}
  .tip{font-size:12px;color:var(--sub);background:var(--field);border-radius:8px;padding:8px 10px;margin:-4px 0 12px;display:none}
  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .seg label{position:relative}
  .seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
  .seg span{display:block;text-align:center;font-size:13px;padding:10px 4px;border-radius:9px;background:var(--chip);border:1.5px solid transparent;user-select:none}
  .seg input:checked + span{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
  .seg input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
  /* 비교표 */
  .blk{margin:2px 0 14px;padding:12px;border-radius:12px;background:var(--field);border:1px solid var(--line)}
  .blk-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;margin-bottom:8px}
  .blk-h b{font-size:14px}
  .blk-h span{font-size:12px;color:var(--sub)}
  .rows{display:flex;flex-direction:column;gap:6px}
  .r,.rh{display:grid;grid-template-columns:46px 1.25fr 1fr 124px 32px;gap:6px;align-items:center}
  .rh{font-size:11.5px;font-weight:700;color:var(--sub);padding:0 2px}
  .r input[type=text],.r select{padding:9px 10px;font-size:14px;background:var(--card)}
  .kd{font-size:11.5px;font-weight:800;text-align:center;border-radius:8px;padding:9px 0}
  .kd.oem{background:#0f172a;color:#fff}
  .kd.am{background:var(--chip);color:var(--sub)}
  .r-oem{padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:2px}
  .pw{position:relative;display:block}
  .pw input[type=text]{padding-right:28px;text-align:right}
  .pw i{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-style:normal;font-size:12px;color:var(--sub);pointer-events:none}
  .rm{border:0;background:none;color:var(--sub);font-size:20px;line-height:1;cursor:pointer;width:32px;height:38px;border-radius:8px}
  .rm:hover{color:var(--err);background:var(--chip)}
  .addrow{margin-top:8px;font:inherit;font-size:13px;font-weight:700;color:var(--accent);background:none;border:1.5px dashed var(--line);border-radius:9px;padding:8px;width:100%;cursor:pointer}
  .addrow:hover{border-color:var(--accent)}
  .note{font-size:12.5px;background:var(--accent-soft);border-radius:8px;padding:8px 10px;margin-bottom:10px}
  .seg-rotor{margin-bottom:10px}
  .blk .blk{background:var(--card);margin:0}
  .rt-polish{display:grid;grid-template-columns:150px 1fr;gap:8px}
  @media (max-width:560px){ .rt-polish{grid-template-columns:1fr} }
  .tsize{display:grid;grid-template-columns:1fr 18px 1fr 22px 1fr;align-items:center;gap:6px}
  .tsize .sep{text-align:center;color:var(--sub);font-weight:700}
  .tsize-lab{display:grid;grid-template-columns:1fr 18px 1fr 22px 1fr;gap:6px;font-size:11.5px;color:var(--sub);font-weight:700;margin-bottom:4px}
  .chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);margin:8px 0 0;cursor:pointer}
  .chk input{accent-color:var(--accent)}
  .rear{margin-top:10px}
  .axle{font-size:12.5px;font-weight:800;margin:2px 0 4px}
  .t-rear select:disabled{opacity:.6;cursor:not-allowed}
  .r.r-tire,.rh.h-tire{grid-template-columns:130px 1fr 104px 124px 32px}
  .topspec{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:10px}
  @media (max-width:560px){
    .topspec{grid-template-columns:1fr 1fr}
    .topspec .f:nth-child(3){grid-column:1 / -1}
    .r{grid-template-columns:42px 1fr 104px 28px;grid-template-areas:"k n n x" "f f p x";padding-bottom:8px;border-bottom:1px dashed var(--line)}
    .r .kd{grid-area:k;align-self:stretch;display:flex;align-items:center;justify-content:center}
    .r .x-name{grid-area:n} .r .x-feat{grid-area:f} .r .pw{grid-area:p} .r .rm,.r .sp{grid-area:x}
    .r-oem{border-bottom:1px solid var(--line)}
    .rh{display:none}
    .r.r-tire{grid-template-columns:1fr 104px 28px;grid-template-areas:"c t x" "n p x"}
    .r-tire .x-brand{grid-area:c} .r-tire .x-type{grid-area:t} .r-tire .x-name{grid-area:n} .r-tire .pw{grid-area:p} .r-tire .rm{grid-area:x}
    .rm{width:28px}
  }
  .add{width:100%;font:inherit;font-size:14px;font-weight:700;padding:12px;border-radius:12px;border:1.5px dashed var(--line);background:transparent;color:var(--sub);cursor:pointer}
  .add:hover{border-color:var(--accent);color:var(--accent)}
  .review{display:none;border:2px solid var(--accent)}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .actions .btn{padding:15px;font-size:16px}
  .saved{font-size:12px;color:var(--sub);text-align:center;margin-top:10px}

  /* ===== 추천서 문서 ===== */
  #docView{display:none}
  .doc-bar{display:flex;gap:10px;margin-bottom:14px}
  .doc-bar .btn{flex:1;padding:14px}
  .doc{background:#fff;color:#111;border-radius:12px;padding:36px 34px;font-size:13px;line-height:1.6;border:1px solid #e5e7eb}
  .doc h3{margin:0;font-size:24px;font-weight:900;letter-spacing:-.02em}
  .doc .top{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #0f172a;padding-bottom:12px;margin-bottom:18px;gap:12px}
  .doc .meta{text-align:right;font-size:12px;color:#4b5563}
  .doc .club{font-size:11px;font-weight:700;letter-spacing:.1em;color:#f97316;margin-bottom:4px}
  .doc table.car{width:100%;border-collapse:collapse;margin-bottom:20px;font-size:12.5px}
  .doc table.car th,.doc table.car td{border:1px solid #d1d5db;padding:7px 9px;text-align:left}
  .doc table.car th{background:#f3f4f6;width:16%;font-weight:700}
  .doc h4{font-size:14px;margin:22px 0 10px;padding-left:8px;border-left:4px solid #f97316}
  .doc .it{border:1px solid #d1d5db;border-radius:8px;margin-bottom:10px;page-break-inside:avoid;break-inside:avoid}
  .doc .it-h{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:#f9fafb;border-bottom:1px solid #d1d5db;font-weight:700}
  .doc .tag{font-size:11.5px;padding:2px 9px;border-radius:999px;font-weight:700}
  .doc .tag.now{background:#fee2e2;color:#b91c1c}
  .doc .tag.check{background:#fef3c7;color:#92400e}
  .doc .tag.no{background:#e5e7eb;color:#374151}
  .doc .it dl{display:grid;grid-template-columns:90px 1fr;margin:0;padding:8px 12px;gap:3px 10px}
  .doc .it dt{color:#6b7280;font-size:12px}
  .doc .it dd{margin:0}
  .doc .sub{padding:9px 12px 0;font-size:12.5px}
  .doc .sub b{margin-right:4px}
  .doc table.cmp{width:calc(100% - 24px);margin:10px 12px 2px;border-collapse:collapse;font-size:12px}
  .doc table.cmp caption{text-align:left;font-weight:700;font-size:12.5px;padding:0 0 4px}
  .doc table.cmp th,.doc table.cmp td{border:1px solid #e5e7eb;padding:5px 8px;text-align:left}
  .doc table.cmp th{background:#f9fafb;font-weight:700;color:#4b5563}
  .doc table.cmp .p{text-align:right;white-space:nowrap;width:24%}
  .doc table.cmp .k{width:9%;white-space:nowrap;text-align:center}
  .doc table.cmp tr.oem td{background:#f8fafc;font-weight:600}
  .doc .sub.tipline{color:#6b7280;font-size:11.5px;padding-top:6px}
  .doc .low{display:inline-block;font-size:10.5px;font-weight:700;color:#15803d;background:#dcfce7;border-radius:999px;padding:0 6px;margin-right:4px}
  .doc .box{border:1px solid #d1d5db;border-radius:8px;padding:10px 12px;white-space:pre-wrap;min-height:40px}
  .doc .warn{margin-top:20px;font-size:11.5px;color:#4b5563;background:#f9fafb;border-radius:8px;padding:10px 12px}
  .doc .sign{display:flex;justify-content:flex-end;gap:28px;margin-top:22px;font-size:12.5px}
  .doc .sign span{border-bottom:1px solid #9ca3af;padding:0 6px 2px;min-width:110px;display:inline-block}

  @media print{
    @page{size:A4;margin:14mm}
    body{background:#fff}
    header,#formView,.doc-bar,footer{display:none!important}
    main{margin:0;padding:0}
    #docView{display:block!important}
    .doc{border:0;padding:0;border-radius:0}
  }
  footer{text-align:center;color:var(--sub);font-size:12px;padding:8px 16px 32px}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a class="back" href="../">← 동아리 처음 화면</a><br>
    <span class="badge" id="modeBadge">YANGIL AUTO CLUB</span>
    <h1 id="pageTitle">부품 추천서 작성</h1>
    <p id="pageDesc">접수 목록에서 차량을 고른 뒤, 항목마다 규격·품번·가격·근거를 조사해서 적어 주세요.</p>
  </div>
</header>

<main>
<div class="wrap">

<div id="formView">

  <section class="card">
    <h2><span class="n">1</span>접수 정보</h2>
    <div class="f">
      <label class="t" for="pick">접수 목록에서 선택<span class="req">*</span></label>
      <div class="load">
        <select id="pick"><option value="">목록 불러오는 중…</option></select>
        <button type="button" class="btn" id="refreshBtn" title="목록 새로고침">↻</button>
      </div>
      <label class="hidedone" id="hideDoneWrap"><input type="checkbox" id="hideDone" checked> 전달 완료 건 숨기기</label>
      <details class="manual">
        <summary>접수번호 직접 입력</summary>
        <div class="load" style="margin-top:8px">
          <input type="text" id="rid" placeholder="예: C1103-AB12">
          <button type="button" class="btn" id="loadBtn">불러오기</button>
        </div>
      </details>
      <div class="msg" id="loadMsg"></div>
      <div class="req-box" id="reqBox"></div>
    </div>
    <div class="f" style="margin-bottom:0">
      <label class="t" for="students">조사 학생<span class="req">*</span></label>
      <input type="text" id="students" placeholder="학번 이름, 여러 명이면 쉼표로 (예: 20701 김민준, 20715 이서연)">
    </div>
  </section>

  <section class="card">
    <h2><span class="n">2</span>차량 정보</h2>
    <div class="f">
      <label class="t" for="plate">차량번호<span class="opt">같은 차종이면 번호로 구분</span></label>
      <input type="text" id="plate" style="font-weight:700;letter-spacing:.03em">
    </div>
    <div class="row3">
      <div class="f"><label class="t" for="maker">제조사</label><input type="text" id="maker"></div>
      <div class="f"><label class="t" for="model">차종</label><input type="text" id="model"></div>
      <div class="f"><label class="t" for="year">연식</label><input type="text" id="year"></div>
    </div>
    <div class="row3">
      <div class="f"><label class="t" for="fuel">연료</label><input type="text" id="fuel"></div>
      <div class="f"><label class="t" for="trim">엔진·트림</label><input type="text" id="trim"></div>
      <div class="f"><label class="t" for="km">주행거리(km)</label><input type="text" id="km" inputmode="numeric"></div>
    </div>
    <div class="f" style="margin-bottom:0">
      <label class="t" for="vin">차대번호<span class="opt">있으면 순정 품번 조회에 사용</span></label>
      <input type="text" id="vin" style="text-transform:uppercase;letter-spacing:.05em">
    </div>
  </section>

  <section class="card">
    <h2><span class="n">3</span>항목별 추천</h2>
    <div id="items"></div>
    <button type="button" class="add" id="addBtn">+ 항목 추가</button>
  </section>

  <section class="card">
    <h2><span class="n">4</span>종합 의견</h2>
    <textarea id="summary" placeholder="예: 주행거리 대비 브레이크 패드는 출고 후 미교체라 우선 점검을 권장합니다. 엔진오일은 순정 규격 제품 중 가격 차이가 크니 아래 대체품도 참고하세요."></textarea>
  </section>

  <section class="card review" id="reviewCard">
    <h2><span class="n">✓</span>지도교사 검토</h2>
    <div class="f">
      <label class="t" for="rvStatus">검토 상태</label>
      <select id="rvStatus">
        <option>검토중</option><option>수정 요청</option><option>검토 완료</option>
      </select>
    </div>
    <div class="f" style="margin-bottom:0">
      <label class="t" for="rvComment">지도교사 의견<span class="opt">추천서에 표시됨</span></label>
      <textarea id="rvComment" placeholder="예: 학생 조사 내용을 확인했습니다. 브레이크 패드는 정비소에서 잔량 확인 후 교체하세요."></textarea>
    </div>
  </section>

  <div class="msg" id="saveMsg" style="text-align:center;margin-bottom:10px"></div>
  <div class="actions">
    <button type="button" class="btn ghost" id="previewBtn">추천서 미리보기</button>
    <button type="button" class="btn accent" id="submitBtn">제출하기</button>
  </div>
  <div class="saved" id="savedNote">작성 내용은 이 기기에 자동으로 임시 저장됩니다.</div>
</div>

<div id="docView">
  <div class="doc-bar">
    <button type="button" class="btn ghost" id="backBtn">← 돌아가서 수정</button>
    <button type="button" class="btn accent" id="printBtn">인쇄 / PDF 저장</button>
  </div>
  <div class="doc" id="doc"></div>
</div>

</div>
</main>

<footer>양일고등학교 자동차 동아리</footer>

<template id="itemTpl">
  <div class="item">
    <div class="item-head">
      <span class="no"></span>
      <input type="text" class="k-item" list="itemList" placeholder="항목 (예: 엔진오일·오일필터)">
      <button type="button" class="del">삭제</button>
    </div>
    <div class="tip"></div>
    <div class="f">
      <label class="t">교체 판단<span class="req">*</span></label>
      <div class="seg">
        <label><input type="radio" value="지금 교체 권장"><span>지금 교체 권장</span></label>
        <label><input type="radio" value="점검 후 결정"><span>점검 후 결정</span></label>
        <label><input type="radio" value="아직 교체 불필요"><span>아직 불필요</span></label>
      </div>
    </div>
    <div class="ext"></div>
    <div class="gen">
      <div class="f">
        <label class="t">규격·사양<span class="req">*</span></label>
        <input type="text" class="k-spec">
      </div>
      <div class="row">
        <div class="f">
          <label class="t">순정 품번<span class="opt">선택</span></label>
          <input type="text" class="k-oem" placeholder="예: 26300-35505">
        </div>
        <div class="f">
          <label class="t">호환·대체 부품<span class="opt">선택</span></label>
          <input type="text" class="k-alt" placeholder="규격이 맞는 다른 제품">
        </div>
      </div>
      <div class="f">
        <label class="t">예상 부품 가격</label>

<script>

let radioSeq = 0;

function renumber(){

function applyHint(card){

/* ---- 항목 종류: 엔진오일(oil) / 엔진 에어필터(filter) / 일반(gen) ---- */
const kindOf = name => /엔진\s*오일/.test(name) ? 'oil'
  : /로터|브레이크\s*디스크/.test(name) ? 'rotor'
  : /브레이크\s*(액|오일|플루이드)/.test(name) ? 'fluid'
  : /타이어/.test(name) ? 'tire'
  : /브레이크\s*패드/.test(name) ? 'pad'
  : (/에어\s*(필터|클리너)/.test(name) && !/에어컨|실내/.test(name)) ? 'filter' : 'gen';
const digits = s => String(s ?? '').replace(/[^\d]/g, '');
const won = s => digits(s) ? Number(digits(s)).toLocaleString('ko-KR') + '원' : '';

  inp.addEventListener('input', () => {
    const d = digits(inp.value).slice(0, 9);

}
function rmBtn(row){

}
const BLK = {
  oils:     { title:'엔진오일', hint:'점도·규격이 맞는 제품끼리 가격과 성능 비교', list:'oilList',
              oem:'순정 오일명 (예: 현대 순정 / BMW LL-17FE+)', am:'오일명 (예: 킥스 PAO 1)', feat:'100% 합성, API SP' },
  ofilters: { title:'오일필터', hint:'순정과 AM(애프터마켓) 제품 비교', list:'filterList',

  afilters: { title:'에어클리너', hint:'오일 교체 때 함께 교체 — 순정과 AM 비교', list:'filterList',
              oem:'순정 품번', am:'제조사·제품명', feat:'세척형 / 일반형' },
  rotors:   { title:'로터 제품 비교', hint:'순정과 AM 비교', list:'rotorList',
              oem:'순정 품번', am:'제조사·제품명', feat:'통풍형·슬롯형, 코팅' },
  pads:     { title:'브레이크 패드', hint:'소음·분진·제동력 같은 특징과 가격 비교', list:'padList',
              oem:'순정 품번 또는 제품명', am:'제조사·제품명 (예: 브렘보 P30 xxx)', feat:'세라믹, 저분진·저소음' }
};
function cmpRow(key, d = {}, oem = false){
  const c = BLK[key];
  const r = document.createElement('div'); r.className = 'r' + (oem ? ' r-oem' : '');
  r.innerHTML = `<span class="kd ${oem ? 'oem' : 'am'}">${oem ? '순정' : 'AM'}</span>` +
    `<input type="text" class="x-name" ${oem ? '' : `list="${c.list}"`}>` +
    `<input type="text" class="x-feat">`;
  const n = r.querySelector('.x-name'), f = r.querySelector('.x-feat');
  n.placeholder = oem ? c.oem : c.am; f.placeholder = '특징 (예: ' + c.feat + ')';
  n.value = d.name || d.maker || ''; f.value = d.feat || '';
  r.append(priceInput(d.price));
  if (oem){ const sp = document.createElement('span'); sp.className = 'sp'; r.append(sp); } else r.append(rmBtn(r));
  return r;
}
function rowsBlock(key, rows){
  const c = BLK[key];
  rows = rows || [];
  const oemRow = rows.find(x => x.kind === '순정') || {};
  const am = rows.filter(x => x.kind !== '순정');
  const b = document.createElement('div'); b.className = 'blk'; b.dataset.key = key;
  b.innerHTML = `<div class="blk-h"><b>${c.title}</b><span>${c.hint}</span></div>` +
    '<div class="rh"><span>구분</span><span>제품명</span><span>특징</span><span>가격</span><span></span></div>' +
    '<div class="rows"></div><button type="button" class="addrow">+ AM 제품 추가</button>';
  const box = b.querySelector('.rows');
  box.appendChild(cmpRow(key, oemRow, true));
  (am.length ? am : [{}, {}]).forEach(x => box.appendChild(cmpRow(key, x)));
  b.querySelector('.addrow').addEventListener('click', () => {
    const r = cmpRow(key); box.appendChild(r); r.querySelector('.x-name').focus();
  });

}
function readRows(card, key){
  const b = card.querySelector(`.blk[data-key="${key}"]`);
  if (!b) return [];
  return [...b.querySelectorAll('.r')].map(r => ({
    kind: r.classList.contains('r-oem') ? '순정' : 'AM',
    name: r.querySelector('.x-name').value.trim(),
    feat: r.querySelector('.x-feat').value.trim(),
    price: digits(r.querySelector('.x-price').value)
  })).filter(x => x.name || x.feat || x.price);
}
/* ---- 타이어 ---- */
const T_W = Array.from({length:20}, (_, i) => 145 + i * 10);          // 145~335
const T_A = Array.from({length:12}, (_, i) => 25 + i * 5);            // 25~80
const T_R = Array.from({length:10}, (_, i) => 13 + i);                // 13~22
const T_BRANDS = ['한국타이어','금호타이어','넥센타이어','미쉐린','브리지스톤','콘티넨탈','피렐리','굿이어','요코하마','던롭','기타'];
const T_TYPES = ['썸머','올시즌','올웨더','윈터','기타'];
const opts = (arr, sel, ph) => `<option value="">${ph}</option>` + arr.map(v => `<option${String(v) === String(sel) ? ' selected' : ''}>${v}</option>`).join('');
function parseTire(str){
  const m = String(str || '').match(/(\d{3})\s*\/\s*(\d{2})\s*Z?R?F?\s*(\d{2})/i);
  return m ? { w: m[1], a: m[2], r: m[3] } : {};
}
const tireStr = t => t && t.w && t.a && t.r ? `${t.w}/${t.a} R${t.r}` : '';
function sizePicker(cls, t = {}, title = ''){
  const w = document.createElement('div');
  w.className = cls;
  w.innerHTML = (title ? `<div class="axle">${title}</div>` : '') +
    '<div class="tsize-lab"><span>폭(mm)</span><span></span><span>편평비</span><span></span><span>인치</span></div>' +
    `<div class="tsize"><select class="t-w">${opts(T_W, t.w, '폭')}</select><span class="sep">/</span>` +
    `<select class="t-a">${opts(T_A, t.a, '편평비')}</select><span class="sep">R</span>` +
    `<select class="t-r">${opts(T_R, t.r, '인치')}</select></div>`;
  return w;
}
function readSize(el){
  if (!el) return null;
  const g = c => el.querySelector(c).value;
  return { w: g('.t-w'), a: g('.t-a'), r: g('.t-r') };
}
function tireRow(d = {}){
  const r = document.createElement('div'); r.className = 'r r-tire';
  r.innerHTML = `<select class="x-brand">${opts(T_BRANDS, d.brand, '타이어 회사')}</select>` +
    '<input type="text" class="x-name" placeholder="타이어명 (예: 벤투스 S1 evo3)">' +
    `<select class="x-type">${opts(T_TYPES, d.type, '종류')}</select>`;
  r.querySelector('.x-name').value = d.name || '';
  r.append(priceInput(d.price), rmBtn(r));
  return r;
}
const sameSize = (a, b) => !!a && !!b && a.w === b.w && a.a === b.a && a.r === b.r;
function tireBlock(d = {}){
  const w = document.createElement('div');
  const front = d.tsize || {};
  // 예전 저장본은 square 값이 없음 → 뒤 규격이 없거나 같으면 스퀘어로 봄
  const square = d.square !== undefined ? !!d.square : (!d.trear || !d.trear.w || sameSize(front, d.trear));
  const size = document.createElement('div'); size.className = 'f';
  size.innerHTML = '<label class="t">타이어 규격<span class="req">*</span></label>';
  const fp = sizePicker('t-front', front, '앞 타이어');
  const chk = document.createElement('label'); chk.className = 'chk';
  chk.innerHTML = '<input type="checkbox" class="t-square"> 스퀘어 세팅 (앞뒤 같은 규격 — 뒤 타이어 자동 입력)';
  const rp = sizePicker('t-rear rear', square ? front : (d.trear || {}), '뒤 타이어');
  size.append(fp, chk, rp);
  const sq = chk.querySelector('input');
  sq.checked = square;
  const sync = () => {
    rp.querySelectorAll('select').forEach(sel => {
      sel.disabled = sq.checked;
      if (sq.checked) sel.value = fp.querySelector('.' + sel.className).value;
    });
  };
  sq.addEventListener('change', sync);
  fp.querySelectorAll('select').forEach(sel => sel.addEventListener('change', sync));
  sync();

  const pos = document.createElement('div'); pos.className = 'f';
  pos.innerHTML = '<label class="t">교체 위치<span class="req">*</span></label>' +
    '<select class="o-tpos"><option value="">선택</option><option>앞 (2개)</option><option>뒤 (2개)</option><option>앞·뒤 (4개)</option></select>';
  pos.querySelector('.o-tpos').value = d.tpos || '';
  const note = document.createElement('div'); note.className = 'note';
  note.textContent = '💡 타이어는 좌우를 같이 바꾸는 것이 좋습니다.';

  const b = document.createElement('div'); b.className = 'blk'; b.dataset.key = 'tires';
  b.innerHTML = '<div class="blk-h"><b>추천 타이어</b><span>같은 규격 제품끼리 종류·가격 비교 (가격은 1개 기준)</span></div>' +
    '<div class="rh h-tire"><span>타이어 회사</span><span>타이어명</span><span>종류</span><span>가격(1개)</span><span></span></div>' +
    '<div class="rows"></div><button type="button" class="addrow">+ 타이어 추가</button>';
  const box = b.querySelector('.rows');
  ((d.tires && d.tires.length) ? d.tires : [{}, {}]).forEach(x => box.appendChild(tireRow(x)));
  b.querySelector('.addrow').addEventListener('click', () => { const r = tireRow(); box.appendChild(r); r.querySelector('select').focus(); });
  w.append(size, pos, note, b);
  return w;
}
function readTire(card){
  const sq = card.querySelector('.t-square');
  const front = readSize(card.querySelector('.t-front'));
  const square = !!(sq && sq.checked);
  return {
    tsize: front,
    square,
    trear: square ? Object.assign({}, front) : readSize(card.querySelector('.t-rear')),
    tpos: v_(card, 'tpos'),
    tires: [...card.querySelectorAll('.blk[data-key="tires"] .r')].map(r => ({
      brand: r.querySelector('.x-brand').value, name: r.querySelector('.x-name').value.trim(),
      type: r.querySelector('.x-type').value, price: digits(r.querySelector('.x-price').value)
    })).filter(x => x.brand || x.name || x.price)
  };
}

let rotorSeq = 0;
function rotorBlock(d = {}){
  const r = d.rotor || {}, grp = 'rot' + (++rotorSeq);
  const w = document.createElement('div'); w.className = 'blk rotor';
  w.innerHTML = '<div class="blk-h"><b>브레이크 디스크(로터)</b><span>패드와 함께 상태 확인</span></div>' +
    '<div class="note">💡 로터는 패드를 2번 교체할 때 1번 교체하는 것을 추천드려요.</div>' +
    '<div class="seg seg-rotor">' + ['교체', '연마', '이번엔 안 함'].map(v =>
      `<label><input type="radio" class="rt-act" name="${grp}" value="${v}"><span>${v}</span></label>`).join('') + '</div>' +
    '<div class="rt-swap"></div>' +
    '<div class="rt-polish"><div class="f" style="margin:0"><label class="t">연마 예상 비용</label></div>' +
    '<div class="f" style="margin:0"><label class="t">비고</label><input type="text" class="rt-note" placeholder="예: 최소 두께 여유 있음, 떨림 있어 연마 권장"></div></div>';
  w.querySelectorAll('.rt-act').forEach(x => x.checked = x.value === r.act);
  w.querySelector('.rt-polish .f').append(priceInput(r.polishPrice));
  w.querySelector('.rt-note').value = r.polishNote || '';
  w.querySelector('.rt-swap').append(rowsBlock('rotors', d.rotors));
  const sync = () => {
    const a = (w.querySelector('.rt-act:checked') || {}).value;
    w.querySelector('.rt-swap').style.display = a === '교체' ? '' : 'none';
    w.querySelector('.rt-polish').style.display = a === '연마' ? '' : 'none';
  };
  w.querySelectorAll('.rt-act').forEach(x => x.addEventListener('change', sync));
  sync();
  return w;
}
function readRotor(card){
  const w = card.querySelector('.blk.rotor');
  if (!w) return {};
  const act = (w.querySelector('.rt-act:checked') || {}).value || '';
  return {
    rotor: { act, polishPrice: act === '연마' ? digits(w.querySelector('.rt-polish .x-price').value) : '',
             polishNote: act === '연마' ? w.querySelector('.rt-note').value.trim() : '' },
    rotors: act === '교체' ? readRows(card, 'rotors') : []
  };
}
const v_ = (card, c) => ((card.querySelector('.o-' + c) || {}).value || '').trim();
function readExt(card){
  const kind = card.dataset.kind, out = {};
  if (kind === 'oil'){
    out.oil = { visc: v_(card, 'visc'), cap: v_(card, 'cap'), std: v_(card, 'std') };
    out.oils = readRows(card, 'oils');
    out.ofilters = readRows(card, 'ofilters');
  }
  if (kind === 'oil' || kind === 'filter') out.afilters = readRows(card, 'afilters');
  if (kind === 'pad'){ out.pos = v_(card, 'pos'); out.pads = readRows(card, 'pads'); }
  if (kind === 'pad' || kind === 'rotor') Object.assign(out, readRotor(card));
  if (kind === 'fluid'){ out.dot = v_(card, 'dot'); out.frange = v_(card, 'frange'); }
  if (kind === 'tire') Object.assign(out, readTire(card));
  return out;
}
function buildExt(card, d = {}){
  const kind = kindOf(card.querySelector('.k-item').value);
  card.dataset.kind = kind;
  card.querySelector('.gen').style.display = kind === 'gen' ? '' : 'none';
  const ext = card.querySelector('.ext');
  ext.innerHTML = '';
  if (kind === 'oil'){
    const o = d.oil || {};
    const spec = document.createElement('div');
    spec.className = 'topspec';
    spec.innerHTML =
      '<div class="f"><label class="t">오일 점도<span class="req">*</span></label><input type="text" class="o-visc" placeholder="예: 0W-20"></div>' +
      '<div class="f"><label class="t">오일 용량<span class="req">*</span></label><input type="text" class="o-cap" placeholder="예: 4.2L (필터 포함)"></div>' +
      '<div class="f"><label class="t">요구 규격<span class="opt">선택</span></label><input type="text" class="o-std" placeholder="예: API SP / ACEA C5 / BMW LL-17FE+"></div>';
    spec.querySelector('.o-visc').value = o.visc || '';
    spec.querySelector('.o-cap').value = o.cap || '';
    spec.querySelector('.o-std').value = o.std || '';
    ext.append(spec, rowsBlock('oils', d.oils), rowsBlock('ofilters', d.ofilters), rowsBlock('afilters', d.afilters));
  } else if (kind === 'filter'){
    ext.append(rowsBlock('afilters', d.afilters));
  } else if (kind === 'pad'){
    const top = document.createElement('div');
    top.className = 'f';
    top.innerHTML = '<label class="t">교체 위치<span class="req">*</span></label>' +
      '<select class="o-pos"><option value="">선택</option><option>앞</option><option>뒤</option><option>앞·뒤</option></select>';
    top.querySelector('.o-pos').value = d.pos || '';
    ext.append(top, rowsBlock('pads', d.pads), rotorBlock(d));
  } else if (kind === 'rotor'){
    ext.append(rotorBlock(d));
  } else if (kind === 'tire'){
    if (!d.tsize && d.spec) d = Object.assign({}, d, { tsize: parseTire(d.spec) });
    ext.append(tireBlock(d));
  } else if (kind === 'fluid'){
    const top = document.createElement('div');
    top.className = 'row';
    top.innerHTML =
      '<div class="f"><label class="t">규격<span class="req">*</span></label>' +
      '<select class="o-dot"><option value="">선택</option><option>DOT 3</option><option>DOT 4</option>' +
      '<option>DOT 4 LV (저점도)</option><option>DOT 5.1</option><option>DOT 5 (실리콘계)</option></select></div>' +
      '<div class="f"><label class="t">가격대</label><input type="text" class="o-frange" placeholder="예: 1~2만원 (1L)"></div>';
    top.querySelector('.o-dot').value = d.dot || '';
    top.querySelector('.o-frange').value = d.frange || '';
    ext.append(top);
  }
}

function addItem(d = {}){
  const card = $('itemTpl').content.firstElementChild.cloneNode(true);
  const grp = 'dec' + (++radioSeq);
  card.querySelectorAll('input[type=radio]').forEach(r => { r.classList.add('dec'); r.name = grp; r.checked = r.value === d.decision; });
  const set = (cls, v) => card.querySelector('.k-' + cls).value = v || '';
  ['item','spec','oem','alt','price','labor','source','note'].forEach(k => set(k, d[k]));
  buildExt(card, d);
  card.querySelector('.k-item').addEventListener('input', () => {
    applyHint(card);
    if (kindOf(card.querySelector('.k-item').value) !== card.dataset.kind) buildExt(card, readExt(card));
  });
  card.querySelector('.del').addEventListener('click', () => {
    if (confirm('이 항목을 삭제할까요?')) { card.remove(); renumber(); saveLocal(); }
  });
  $('items').appendChild(card);
  applyHint(card); renumber();
  return card;
}

function collect(){
  const items = [...document.querySelectorAll('#items .item')].map(c => {
    const g = k => c.querySelector('.k-' + k).value.trim();
    const dec = c.querySelector('input.dec:checked');
    const gen = c.dataset.kind === 'gen';
    return Object.assign({ item:g('item'), decision: dec ? dec.value : '',
             spec: gen ? g('spec') : '', oem: gen ? g('oem') : '', alt: gen ? g('alt') : '', price: gen ? g('price') : '',
             labor:g('labor'), source:g('source'), note:g('note') }, readExt(c));
  });
  const vehicle = {};
  CAR.forEach(k => vehicle[k] = $(k).value.trim());
  return {
    type:'rec', mode: REVIEW ? 'review' : 'student',
    id: $('rid').value.trim().toUpperCase(),
    students: $('students').value.trim(),
    vehicle, items, summary: $('summary').value.trim(),
    review: { status: $('rvStatus').value, comment: $('rvComment').value.trim() },
    savedAt: new Date().toISOString()
  };
}

function fill(d){
  $('students').value = d.students || '';
  CAR.forEach(k => $(k).value = (d.vehicle && d.vehicle[k]) || '');
  $('items').innerHTML = '';
  (d.items || []).forEach(addItem);
  $('summary').value = d.summary || '';
  if (d.review){ $('rvStatus').value = d.review.status || '검토중'; $('rvComment').value = d.review.comment || ''; }
}

/* ---- 임시 저장 (이 기기) ---- */
let loadedId = '';   // 불러오기가 끝난 접수번호 — 이 번호일 때만 임시 저장
function saveLocal(){
  const id = $('rid').value.trim().toUpperCase();
  if (!id || id !== loadedId) return;
  try { localStorage.setItem('rec-draft-' + id, JSON.stringify(collect())); } catch(e){}
}
function readLocal(id){
  try { return JSON.parse(localStorage.getItem('rec-draft-' + id) || 'null'); } catch(e){ return null; }
}
// 학생이 실제로 작성한 내용이 있는 임시본인지
function hasContent(d){
  return !!d && !!(d.students || d.summary ||
    (d.items || []).some(i => i.decision || i.spec || i.oem || i.alt || i.price || i.labor || i.source || i.note ||
      (i.oil && (i.oil.visc || i.oil.cap)) || i.pos || (i.oils || []).length || (i.ofilters || []).length ||
      (i.afilters || []).length || (i.pads || []).length || (i.rotor && i.rotor.act) || (i.rotors || []).length || i.dot || i.frange ||
      (i.tires || []).length || i.tpos || (i.tsize && i.tsize.w && i.decision)));
}
let t; document.addEventListener('input', e => {
  if (['pick','rid','hideDone'].includes(e.target.id)) return;
  clearTimeout(t); t = setTimeout(saveLocal, 600);
});

/* ---- 불러오기 ---- */
function msg(el, text, ok){ el.textContent = text; el.className = 'msg ' + (ok ? 'ok' : 'err'); el.style.display = 'block'; }

function showRequest(r){
  const box = $('reqBox');
  const line = (k, v) => v ? `<div><b>${k}</b> ${esc(v)}</div>` : '';
  box.innerHTML = '<b>선생님 요청 내용</b>' +
    line('요청 항목', r.items) + line('타이어 규격', r.tireSize) + line('타이어 메모', r.tireNote) +
    line('최근 교체 이력', r.history) + line('증상·요청', r.memo);
  box.style.display = 'block';
}

function itemsFromRequest(r){
  const list = String(r.items || '').split(',').map(s => s.trim()).filter(Boolean);
  const hasOil = list.some(s => kindOf(s) === 'oil'), hasPad = list.some(s => kindOf(s) === 'pad');
  // 엔진오일 항목 안에 에어클리너 비교가 들어 있으니 따로 만들지 않음
  return list.filter(s => !(hasOil && kindOf(s) === 'filter') && !(hasPad && kindOf(s) === 'rotor')).map(s => {
    const m = s.match(/^기타\((.*)\)$/);
    const it = { item: m ? m[1] : s };
    if (s === '타이어' && r.tireSize) it.tsize = parseTire(r.tireSize);
    return it;
  });
}

/* ---- 접수 목록 ---- */
let LIST = [];
function renderList(){
  const sel = $('pick'), cur = $('rid').value.trim().toUpperCase();
  const hide = $('hideDone').checked;
  const rows = LIST.filter(r => !hide || r.status !== '전달 완료' || r.id === cur);
  sel.innerHTML = '';
  sel.add(new Option(rows.length ? `접수 건을 선택하세요 (${rows.length}건)` : '표시할 접수 건이 없어요', ''));
  rows.forEach(r => {
    const tag = r.rec ? `추천서 ${r.rec}` : r.status;
    const items = r.items.length > 24 ? r.items.slice(0, 24) + '…' : r.items;
    sel.add(new Option(`[${tag}] ${r.date} · ${r.car}${r.plate ? ' ' + r.plate : ''} · ${items}  (${r.id})`, r.id));
  });
  sel.value = rows.some(r => r.id === cur) ? cur : '';
}
async function loadList(){
  if (SCRIPT_URL.startsWith('PASTE')){ $('pick').innerHTML = '<option value="">저장 주소 미설정</option>'; return; }
  $('pick').innerHTML = '<option value="">목록 불러오는 중…</option>';
  try {
    const data = await (await fetch(SCRIPT_URL + '?list=1')).json();
    LIST = data.list || [];
    renderList();
  } catch(e){
    $('pick').innerHTML = '<option value="">목록을 불러오지 못했어요 (↻ 다시 시도)</option>';
  }
}
$('pick').addEventListener('change', e => {
  if (!e.target.value) return;
  $('rid').value = e.target.value;
  loadRec();
});
$('refreshBtn').addEventListener('click', loadList);
$('hideDone').addEventListener('change', renderList);
$('loadBtn').addEventListener('click', () => loadRec());

async function loadRec(){
  const id = $('rid').value.trim().toUpperCase();
  $('rid').value = id;
  if (!id) return msg($('loadMsg'), '접수번호를 입력해 주세요.');
  clearTimeout(t); loadedId = '';
  if (SCRIPT_URL.startsWith('PASTE')){
    const local = readLocal(id);
    loadedId = id;
    if (hasContent(local)){ fill(local); return msg($('loadMsg'), '이 기기에 임시 저장된 내용을 불러왔어요.', true); }
    return msg($('loadMsg'), '저장 주소가 설정되지 않아 직접 입력해야 해요. (관리자: SCRIPT_URL 설정)');
  }
  const btn = $('loadBtn'); btn.disabled = true; btn.textContent = '불러오는 중…';
  $('loadMsg').style.display = 'none';
  try {
    const res = await fetch(SCRIPT_URL + '?id=' + encodeURIComponent(id));
    const data = await res.json();
    if (!data.ok) throw new Error('none');
    if ($('rid').value.trim().toUpperCase() !== id) return;   // 그 사이 다른 건을 고른 경우
    const r = data.request;
    if (r) showRequest(r);
    const fromReq = r ? { plate:r.plate, maker:r.maker, model:r.model, year:r.year, fuel:r.fuel, trim:r.trim,
                          km: r.km ? Number(r.km).toLocaleString('ko-KR') : '', vin:r.vin } : {};
    const local = readLocal(id);
    let d, text;
    if (data.rec){
      const useLocal = !REVIEW && hasContent(local) && local.savedAt > (data.rec.savedAt || '');
      d = useLocal ? local : data.rec;
      text = useLocal ? '제출본보다 최신인 임시 저장본을 불러왔어요.' : '제출된 추천서를 불러왔어요.';
    } else if (hasContent(local)){
      d = local; text = '이 기기에 임시 저장된 내용을 불러왔어요.';
    } else {
      d = { vehicle: fromReq, items: r ? itemsFromRequest(r) : [] };
      text = '차량 정보와 요청 항목을 불러왔어요.';
    }
    // 차량 정보는 비어 있는 칸만 선생님 신청 내용으로 채움
    d.vehicle = Object.assign({}, fromReq, Object.fromEntries(Object.entries(d.vehicle || {}).filter(([, v]) => v)));
    if (!d.items || !d.items.length) d.items = r ? itemsFromRequest(r) : [{}];
    fill(d);
    loadedId = id;
    msg($('loadMsg'), text, true);
  } catch(e){
    msg($('loadMsg'), '해당 접수번호를 찾지 못했어요. 번호를 다시 확인해 주세요.');
  } finally { btn.disabled = false; btn.textContent = '불러오기'; $('pick').value = LIST.some(r => r.id === id) ? id : ''; }
}

/* ---- 검사 ---- */
function validate(d){
  if (!d.id) return '접수번호를 입력해 주세요.';
  if (!REVIEW && !d.students) return '조사 학생을 입력해 주세요.';
  if (!d.items.length) return '추천 항목을 하나 이상 작성해 주세요.';
  for (const [i, it] of d.items.entries()){
    const n = `${i+1}번 항목`;
    if (!it.item) return `${n}의 이름을 입력해 주세요.`;
    if (!it.decision) return `${n}(${it.item})의 교체 판단을 골라 주세요.`;
    const k = kindOf(it.item);
    if (k === 'oil'){
      if (!it.oil || !it.oil.visc) return `${n}(${it.item})의 오일 점도를 입력해 주세요.`;
      if (!it.oil.cap) return `${n}(${it.item})의 오일 용량을 입력해 주세요.`;
      if (!(it.oils || []).some(o => o.name)) return `${n}(${it.item})에 엔진오일을 하나 이상 적어 주세요.`;
      if (!(it.ofilters || []).some(o => o.name)) return `${n}(${it.item})에 오일필터를 하나 이상 적어 주세요.`;
    } else if (k === 'filter'){
      if (!(it.afilters || []).some(o => o.name)) return `${n}(${it.item})에 에어클리너 제품을 하나 이상 적어 주세요.`;
    } else if (k === 'pad'){
      if (!it.pos) return `${n}(${it.item})의 교체 위치(앞/뒤)를 골라 주세요.`;
      if (!(it.pads || []).some(o => o.name)) return `${n}(${it.item})에 브레이크 패드 제품을 하나 이상 적어 주세요.`;
      if (it.rotor && it.rotor.act === '교체' && !(it.rotors || []).some(o => o.name)) return `${n}(${it.item})에서 로터를 교체로 골랐으면 로터 제품을 하나 이상 적어 주세요.`;
    } else if (k === 'tire'){
      const t = it.tsize || {};
      if (!t.w || !t.a || !t.r) return `${n}(${it.item})의 타이어 규격(폭·편평비·인치)을 모두 골라 주세요.`;
      if (!it.trear || !(it.trear.w && it.trear.a && it.trear.r)) return `${n}(${it.item})의 뒤 타이어 규격을 모두 골라 주세요. 앞뒤가 같으면 '스퀘어 세팅'을 체크하세요.`;
      if (!it.tpos) return `${n}(${it.item})의 교체 위치(앞/뒤/앞·뒤)를 골라 주세요.`;
      if (!(it.tires || []).some(x => x.brand && x.name)) return `${n}(${it.item})에 추천 타이어(회사·타이어명)를 하나 이상 적어 주세요.`;
    } else if (k === 'fluid'){
      if (!it.dot) return `${n}(${it.item})의 DOT 규격을 골라 주세요.`;
    } else if (k === 'rotor'){
      if (!it.rotor || !it.rotor.act) return `${n}(${it.item})의 로터 처리(교체/연마/이번엔 안 함)를 골라 주세요.`;
      if (it.rotor.act === '교체' && !(it.rotors || []).some(o => o.name)) return `${n}(${it.item})에 로터 제품을 하나 이상 적어 주세요.`;
    } else if (!it.spec) return `${n}(${it.item})의 규격·사양을 입력해 주세요.`;
    if (!it.source) return `${n}(${it.item})의 근거 출처를 입력해 주세요.`;
  }
  return '';
}

/* ---- 제출 ---- */
$('submitBtn').addEventListener('click', async () => {
  const d = collect();
  const err = validate(d);
  if (err) return msg($('saveMsg'), err);
  if (SCRIPT_URL.startsWith('PASTE')) return msg($('saveMsg'), '저장 주소가 설정되지 않았어요. (관리자: SCRIPT_URL 설정)');
  const btn = $('submitBtn'); btn.disabled = true; btn.textContent = '저장 중…';
  try {
    await fetch(SCRIPT_URL, { method:'POST', mode:'no-cors',

    saveLocal();

    msg($('saveMsg'), REVIEW ? '검토 내용이 저장되었어요.' : '제출되었어요. 지도교사 검토 후 선생님께 전달됩니다.', true);
  } catch(e){
    msg($('saveMsg'), '저장에 실패했어요. 인터넷 연결을 확인해 주세요.');
  } finally { btn.disabled = false; btn.textContent = REVIEW ? '검토 저장' : '제출하기'; }
});

/* ---- 추천서 문서 ---- */
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const TAG = { '지금 교체 권장':'now', '점검 후 결정':'check', '아직 교체 불필요':'no' };

function renderDoc(d){
  const v = d.vehicle, today = new Date().toLocaleDateString('ko-KR');
  const dash = x => x ? esc(x) : '-';
  const km = v.km ? esc(v.km) + ' km' : '-';
  // 비교표: 가격이 적힌 줄 중 가장 싼 줄에 '최저가' 표시
  const cmp = (title, rows) => {
    rows = (rows || []).map(r => Object.assign({}, r, { name: r.name || r.maker || '', kind: r.kind === '순정' ? '순정' : 'AM' }))
                       .filter(r => r.name);
    rows.sort((a, b) => (b.kind === '순정') - (a.kind === '순정'));   // 순정을 맨 위로
    if (!rows.length) return '';
    const ps = rows.map(r => Number(digits(r.price)) || Infinity);
    const min = Math.min(...ps), many = ps.filter(p => p !== Infinity).length > 1;
    const low = j => many && ps[j] === min ? '<span class="low">최저가</span>' : '';
    const body = rows.map((r, j) =>
      `<tr${r.kind === '순정' ? ' class="oem"' : ''}><td class="k">${r.kind}</td><td>${esc(r.name)}</td><td>${dash(r.feat)}</td><td class="p">${low(j)}${won(r.price) || '-'}</td></tr>`).join('');
    return `<table class="cmp"><caption>${title}</caption>` +
      '<tr><th class="k">구분</th><th>제품명</th><th>특징</th><th class="p">가격</th></tr>' + body + '</table>';
  };
  const tireDoc = rows => {
    rows = (rows || []).filter(r => r.brand || r.name);
    if (!rows.length) return '';
    const ps = rows.map(r => Number(digits(r.price)) || Infinity);
    const min = Math.min(...ps), many = ps.filter(p => p !== Infinity).length > 1;
    return '<table class="cmp"><caption>추천 타이어</caption><tr><th>타이어 회사</th><th>타이어명</th><th class="k">종류</th><th class="p">가격(1개)</th></tr>' +
      rows.map((r, j) => `<tr><td>${dash(r.brand)}</td><td>${dash(r.name)}</td><td class="k">${dash(r.type)}</td>` +
        `<td class="p">${many && ps[j] === min ? '<span class="low">최저가</span>' : ''}${won(r.price) || '-'}</td></tr>`).join('') + '</table>';
  };
  const rotorDoc = it => {
    const r = it.rotor || {};
    let h = '';
    if (r.act === '교체') h = '<div class="sub"><b>브레이크 디스크(로터)</b>교체 권장</div>' + cmp('브레이크 디스크(로터)', it.rotors);
    else if (r.act === '연마') h = `<div class="sub"><b>브레이크 디스크(로터)</b>연마 권장${r.polishPrice ? ' · 예상 비용 ' + won(r.polishPrice) : ''}${r.polishNote ? ' · ' + esc(r.polishNote) : ''}</div>`;
    else if (r.act) h = `<div class="sub"><b>브레이크 디스크(로터)</b>${esc(r.act)}</div>`;
    return h + '<div class="sub tipline">※ 로터는 패드를 2번 교체할 때 1번 교체하는 것을 추천드려요.</div>';
  };
  const its = d.items.map((it, i) => {
    const k = kindOf(it.item), o = it.oil || {};
    const extra = k === 'oil'
      ? `<div class="sub"><b>오일 점도</b>${dash(o.visc)} &nbsp;·&nbsp; <b>용량</b>${dash(o.cap)}${o.std ? ` &nbsp;·&nbsp; <b>규격</b>${esc(o.std)}` : ''}</div>` +
        cmp('엔진오일', it.oils) + cmp('오일필터', it.ofilters) + cmp('에어클리너', it.afilters)
      : k === 'filter' ? cmp('에어클리너', it.afilters)
      : k === 'pad' ? `<div class="sub"><b>교체 위치</b>${dash(it.pos)}</div>` + cmp('브레이크 패드', it.pads) + rotorDoc(it)
      : k === 'rotor' ? rotorDoc(it)
      : k === 'tire' ? (() => {
          const sq = it.square !== undefined ? it.square : (!it.trear || sameSize(it.tsize, it.trear));
          const size = sq ? `${dash(tireStr(it.tsize))} (스퀘어 세팅)`
                          : `앞 ${dash(tireStr(it.tsize))} &nbsp;/&nbsp; 뒤 ${dash(tireStr(it.trear))}`;
          return `<div class="sub"><b>규격</b>${size}${it.tpos ? ` &nbsp;·&nbsp; <b>교체 위치</b>${esc(it.tpos)}` : ''}</div>` +
            tireDoc(it.tires) + '<div class="sub tipline">※ 타이어는 좌우를 같이 바꾸는 것이 좋습니다.</div>';
        })()
      : k === 'fluid' ? `<div class="sub"><b>규격</b>${dash(it.dot)}${it.frange ? ` &nbsp;·&nbsp; <b>가격대</b>${esc(it.frange)}` : ''}</div>` : '';
    return `
    <div class="it">
      <div class="it-h"><span>${i+1}. ${esc(it.item)}</span><span class="tag ${TAG[it.decision]||'no'}">${esc(it.decision||'-')}</span></div>
      ${extra}
      <dl>
        ${k === 'gen' ? `<dt>규격·사양</dt><dd>${dash(it.spec)}</dd>` : ''}
        ${it.oem ? `<dt>순정 품번</dt><dd>${esc(it.oem)}</dd>` : ''}
        ${it.alt ? `<dt>호환·대체</dt><dd>${esc(it.alt)}</dd>` : ''}
        ${k === 'gen' ? `<dt>예상 비용</dt><dd>부품 ${dash(it.price)}${it.labor ? ' · 공임 ' + esc(it.labor) : ''}</dd>`
                      : (it.labor ? `<dt>공임 참고</dt><dd>${esc(it.labor)}</dd>` : '')}
        ${it.note ? `<dt>판단 이유</dt><dd>${esc(it.note)}</dd>` : ''}
        <dt>근거</dt><dd>${dash(it.source)}</dd>
      </dl>
    </div>`;
  }).join('');
  $('doc').innerHTML = `
    <div class="top">
      <div><div class="club">YANGIL AUTO CLUB</div><h3>차량 부품 추천서</h3></div>
      <div class="meta">접수번호 <b>${esc(d.id)}</b><br>작성일 ${today}</div>
    </div>
    <table class="car">
      <tr><th>차량번호</th><td>${dash(v.plate)}</td><th>차종</th><td>${dash([v.maker, v.model].filter(Boolean).join(' '))}</td></tr>
      <tr><th>연식</th><td>${dash(v.year)}</td><th>연료</th><td>${dash(v.fuel)}</td></tr>
      <tr><th>엔진·트림</th><td>${dash(v.trim)}</td><th>주행거리</th><td>${km}</td></tr>
      <tr><th>차대번호</th><td colspan="3">${dash(v.vin)}</td></tr>
    </table>
    <h4>항목별 추천</h4>
    ${its || '<div class="box">작성된 항목이 없습니다.</div>'}
    ${d.summary ? `<h4>종합 의견</h4><div class="box">${esc(d.summary)}</div>` : ''}
    ${d.review && d.review.comment ? `<h4>지도교사 의견</h4><div class="box">${esc(d.review.comment)}</div>` : ''}
    <div class="warn">본 추천서는 자동차 동아리 학생들이 공개 자료를 바탕으로 조사한 참고 자료입니다. 실제 교체 전 정비소에서 차량 상태를 확인해 주시고, 브레이크·타이어 등 안전 관련 부품은 반드시 전문 정비소에서 교체해 주세요. 가격은 조사 시점 기준이며 변동될 수 있습니다.</div>
    <div class="sign">
      <div>조사 <span>${dash(d.students)}</span></div>
      <div>검토 <span>자동차 동아리 지도교사</span></div>
    </div>`;
}

$('previewBtn').addEventListener('click', () => {
  renderDoc(collect());
  $('formView').style.display = 'none'; $('docView').style.display = 'block';
  window.scrollTo({top:0});
});
$('backBtn').addEventListener('click', () => {
  $('docView').style.display = 'none'; $('formView').style.display = 'block';
});
$('printBtn').addEventListener('click', () => window.print());
$('addBtn').addEventListener('click', () => addItem().querySelector('.k-item').focus());

/* ---- 모드 ---- */
if (REVIEW){
  document.title = '추천서 검토';
  $('modeBadge').textContent = 'REVIEW MODE'; $('modeBadge').classList.add('rv');
  $('pageTitle').textContent = '추천서 검토';
  $('pageDesc').textContent = '제출된 추천서를 불러와 확인하고, 의견을 남긴 뒤 PDF로 저장해 전달하세요.';
  $('reviewCard').style.display = 'block';
  $('submitBtn').textContent = '검토 저장';
  $('hideDone').checked = false;
} else {
  addItem();
}
loadList();
</script>
</body>
</html>
